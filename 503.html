<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Service Unavailable</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:300,700,900&display=swap">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
	<style>
		/* Standalone on purpose: no link to the css/ files, so the page still renders
		   when its assets are broken or when the URL is nested (relative paths break there).
		   The button, spacing and box-sizing rules are copied from tinman.css and colors.css,
		   keep them in sync. */

		html {
			box-sizing: border-box;
		}

		*, *::before, *::after {
			box-sizing: inherit;
		}

		* {
			line-height: 1.2;
			margin: 0;
		}

		html {
			color: #fff;
			display: table;
			font-family: "Raleway", arial, sans-serif;
			text-transform: uppercase;
			letter-spacing: 0.2em;
			height: 100%;
			text-align: center;
			width: 100%;
		}

		body {
			display: table-cell;
			vertical-align: middle;
			margin: 2em auto;
			background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), rgba(0,0,0,0.5) url(images/500.jpg) no-repeat  center;
			height: 100vh;
			background-size: cover;
		}

		h1 {
			color: #fff;
			font-size: 6em;
			font-weight: 800;
		}
		h2 {
			color: #fff;
			font-size: 2em;
			font-weight: 400;
		}

		p {
			margin: 0 auto 1.4rem;
			width: 40%;
		}

		.missing {
			border: 1px solid rgba(255,255,255, .5);
			max-width: 50%;
			padding: 2.8rem 2.1rem 1.4rem; /* the button brings 1.4rem of its own below it */
			margin: 0 auto;
		}

		/* Buttons, from tinman.css */
		.button {
			display: inline-block;
			height: 38px;
			padding: 0 30px;
			text-align: center;
			font-size: 11px;
			font-weight: 700;
			line-height: 38px;
			letter-spacing: .1rem;
			text-transform: uppercase;
			text-decoration: none !important;
			white-space: nowrap;
			background-color: transparent;
			border-radius: 4px;
			border: 1px solid;
			cursor: pointer;
			margin: 5px 0 1.4rem;
			-webkit-transition: background-color 0.3s, border-color 0.3s;
			transition: background-color 0.3s, border-color 0.3s;
		}

		.button i {
			margin-right: 0.5rem;
		}

		/* From colors.css, a white button so it reads on the dark photo */
		.button-white 			{ color: #6f6f6f !important; background-color: #ffffff !important; border-color: #6f6f6f !important; }
		.button-white:hover 	{ color: #222222 !important; background-color: #ffffff !important; border-color: #6f6f6f !important; }

		@media only screen and (max-width: 17.5em) {

			body, p {
				width: 95%;
			}

			h1 {
				font-size: 4em;
			}

			h2 {
				font-size: 1.5em;
				margin: 0 0 0.3em;
			}

		}

	</style>
</head>
<body>
	<div class="missing">
	 <h1>503</h1>
		<p> We are down for maintenance or briefly overloaded. Please try again shortly. </p>
		<a class="button button-white" href="javascript:location.reload()" title="Try again"><i class="fa fa-refresh"></i> Try Again</a>
	</div>
</body>
</html>

<!-- IE needs 512+ bytes: http://blogs.msdn.com/b/ieinternals/archive/2010/08/19/http-error-pages-in-internet-explorer.aspx -->
